<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Obligar al celular a NO usar memoria caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Panama Joe v3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif; background: #000; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100vh; width: 100vw; overflow: hidden; touch-action: none;
        }
        
        #game-header { width: 100%; text-align: center; padding: 5px; background: #111; z-index: 20; border-bottom: 2px solid #f0c040;}
        #game-header h1 { font-size: 1.1em; color: #f0c040; margin: 0; }
        #status { font-size: 0.8em; color: #aaa; margin: 2px 0; }

        .upload-btn {
            display: inline-block; background: #333; border: 1px solid #f0c040;
            padding: 5px 10px; border-radius: 5px; font-size: 0.8em; color: #f0c040;
        }
        .upload-btn:active { background: #f0c040; color: #000; }
        #manual-load { display: none; }

        #emulator-container {
            width: 100%; max-width: 600px; display: flex; justify-content: center;
        }
        
        [class*="menu"], [class*="toolbar"], [class*="statusbar"] { display: none !important; }
        
        #jsspeccy { width: 100%; aspect-ratio: 4/3; border: 1px solid #333; overflow: hidden; background: #000;}
        #jsspeccy canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; outline: none; object-fit: contain; }

        #gamepad-area {
            width: 100%; max-width: 600px; background: #1a1a2e;
            padding: 10px; z-index: 10; flex-grow: 1; display: flex; flex-direction: column;
        }

        /* --- BOTONES AZUL Y VERDE (Forzados a verse) --- */
        .top-menu { display: flex; justify-content: space-evenly; width: 100%; margin-bottom: 15px; }
        .top-menu .btn { 
            width: 45%; height: 45px; font-size: 0.9em; border-radius: 8px; font-weight: bold;
            display: flex; justify-content: center; align-items: center; text-align: center;
        }
        
        .btn-blue { background: #2980b9 !important; border: 2px solid #5dade2 !important; color: white !important;}
        .btn-blue:active, .btn-blue.active { background: #3498db !important; }
        
        .btn-green { background: #27ae60 !important; border: 2px solid #58d68d !important; color: white !important;}
        .btn-green:active, .btn-green.active { background: #2ecc71 !important; }

        .game-controls { display: flex; justify-content: space-around; align-items: center; width: 100%; margin-top: auto; margin-bottom: auto;}
        .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 5px; }
        
        .btn {
            background: #333; border: 2px solid #555; border-radius: 8px; color: #fff;
            display: flex; justify-content: center; align-items: center; font-size: 1.2em;
            user-select: none; -webkit-user-select: none; font-weight: bold; cursor: pointer;
        }
        .btn:active, .btn.active { background: #f0c040; color: #000; }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .btn-action { width: 85px; height: 85px; border-radius: 50%; background: #a93226; border: 3px solid #e6b0aa; }
        .btn-action:active, .btn-action.active { background: #f0c040; }

        @media (orientation: landscape) {
            #game-header { display: none; } 
            #emulator-container { width: 100vw; height: 100vh; max-width: none; position: fixed; top: 0; left: 0; z-index: 1;}
            #jsspeccy { height: 100vh; width: 100vw; border: none; }
            #gamepad-area { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; border: none; padding: 0; pointer-events: none; z-index: 9999; display: block;}
            .btn { pointer-events: auto; opacity: 0.7; } 
            .btn:active, .btn.active { opacity: 1; }
            .top-menu { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 320px; gap: 10px;}
            .game-controls { position: static; display: block; }
            .d-pad { position: absolute; bottom: 20px; left: 30px; transform: scale(1.1); transform-origin: bottom left; }
            .d-pad .btn { border-radius: 50%; } 
            #btn-jump { position: absolute; bottom: 30px; right: 40px; width: 90px; height: 90px; }
        }
    </style>
</head>
<body>

    <div id="game-header">
        <!-- El título v3 nos confirmará que cargó el código nuevo -->
        <h1>Panama Joe (v3)</h1>
        <div id="status">Iniciando emulador...</div>
        <label for="manual-load" class="upload-btn">📂 Cargar manual</label>
        <input type="file" id="manual-load" accept=".tap">
    </div>

    <div id="emulator-container">
        <div id="jsspeccy"></div>
    </div>

    <div id="gamepad-area">
        <div class="top-menu">
            <div class="btn btn-blue" data-key="4">⚙️ CONFIG (4)</div>
            <div class="btn btn-green" data-key="j">▶ JUGAR (J)</div>
        </div>

        <div class="game-controls">
            <div class="d-pad">
                <div id="btn-up" class="btn" data-key="q">↑</div>
                <div id="btn-left" class="btn" data-key="o">←</div>
                <div id="btn-down" class="btn" data-key="a">↓</div>
                <div id="btn-right" class="btn" data-key="i">→</div>
            </div>
            <div id="btn-jump" class="btn btn-action" data-key="Space">SALTO</div>
        </div>
    </div>

    <script src="jsspeccy/jsspeccy.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');

            const speccy = JSSpeccy(document.getElementById('jsspeccy'), {
                autoStart: true, autoLoadTapes: true, sandbox: false, machine: 48,
                uiEnabled: false, zoom: 1
            });

            function autoLoadROM() {
                statusEl.textContent = 'Auto-cargando juego...';
                fetch('panamajoe.tap')
                    .then(r => r.blob())
                    .then(blob => {
                        const file = new File([blob], "panamajoe.tap");
                        if (typeof speccy.openTAPFile === 'function') { speccy.openTAPFile(file); }
                        else {
                            const dt = new DataTransfer(); dt.items.add(file);
                            document.getElementById('jsspeccy').dispatchEvent(new DragEvent('drop', { bubbles: true, dataTransfer: dt }));
                        }
                        statusEl.textContent = '¡Cargando! SI VES RAYAS, ESPERA.';
                    }).catch(e => statusEl.textContent = 'Falla red. Usa botón manual.');
            }

            document.getElementById('manual-load').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                statusEl.textContent = 'Cargando... ESPERA LAS RAYAS.';
                if (typeof speccy.openTAPFile === 'function') speccy.openTAPFile(file);
            });

            // Los navegadores de celular bloquean auto-carga sin que el usuario toque la pantalla. 
            // Si en 2 segundos no arranca solo, toca "Cargar manual".
            setTimeout(autoLoadROM, 1500);

            const keyMap = { 
                '4':'4', 'j':'J', 
                'q':'Q', 'a':'A', 'o':'O', 'i':'I', 
                'Space':' '
            };

            function sendKey(key, isDown) {
                const canvas = document.querySelector('#jsspeccy canvas');
                if (!canvas) return;
                canvas.focus();
                
                const actualKey = keyMap[key] || key;
                let keyCode;
                if (key === 'Space') keyCode = 32;
                else keyCode = actualKey.toUpperCase().charCodeAt(0);

                const eventType = isDown ? 'keydown' : 'keyup';
                const event = new KeyboardEvent(eventType, {
                    key: actualKey, code: 'Key' + actualKey.toUpperCase(),
                    keyCode: keyCode, which: keyCode, bubbles: true, cancelable: true 
                });
                
                Object.defineProperty(event, 'keyCode', {get: () => keyCode});
                Object.defineProperty(event, 'which', {get: () => keyCode});
                
                canvas.dispatchEvent(event);
            }

            document.querySelectorAll('.btn').forEach(btn => {
                const key = btn.getAttribute('data-key');
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault(); btn.classList.add('active'); sendKey(key, true);
                });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault(); btn.classList.remove('active'); sendKey(key, false);
                });
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault(); btn.classList.remove('active'); sendKey(key, false);
                });
            });

            window.addEventListener('contextmenu', e => e.preventDefault());
        });
    </script>
</body>
</html>
