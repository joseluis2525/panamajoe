<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Panama Joe - Android</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #000; color: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            height: 100vh; overflow: hidden; touch-action: none; 
        }
        
        #game-header {
            width: 100%; text-align: center; padding: 10px 0;
            background: #111; border-bottom: 2px solid #f0c040;
            z-index: 10;
        }
        #game-header h1 { font-size: 1.2em; color: #f0c040; margin: 0; }
        #status { font-size: 0.8em; color: #aaa; margin-top: 5px; }

        #emulator-container {
            width: 100%; max-width: 600px;
            flex-grow: 1; display: flex;
            align-items: center; justify-content: center;
            background: #000; padding: 5px;
        }
        
        #jsspeccy {
            width: 100%; aspect-ratio: 4 / 3;
            background: #111; border: 1px solid #333;
            image-rendering: pixelated;
        }
        
        #jsspeccy canvas {
            display: block; width: 100% !important; height: 100% !important;
            image-rendering: pixelated;
        }

        #gamepad {
            width: 100%; max-width: 600px; height: 160px;
            background: #1a1a2e; border-top: 2px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; z-index: 10;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 5px;
        }

        .btn {
            background: #333; border: 2px solid #555;
            border-radius: 10px; color: #fff; font-size: 1.2em;
            display: flex; justify-content: center; align-items: center;
            user-select: none; -webkit-user-select: none;
        }
        
        .btn:active, .btn.active { background: #f0c040; color: #000; border-color: #fff; }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .action-buttons { display: flex; gap: 15px; }
        .btn-action {
            width: 70px; height: 70px; border-radius: 50%;
            background: #a93226; border: 3px solid #e6b0aa;
            font-weight: bold; font-size: 1.1em;
        }
        .btn-action:active, .btn-action.active { background: #f0c040; }

        @media (min-height: 700px) {
            #gamepad { height: 200px; padding: 20px 30px; }
            .d-pad { grid-template-columns: 70px 70px 70px; grid-template-rows: 70px 70px; }
            .btn-action { width: 85px; height: 85px; }
        }
    </style>
</head>
<body>

    <div id="game-header">
        <h1>Panama Joe</h1>
        <div id="status">Iniciando sistema...</div>
    </div>

    <div id="emulator-container">
        <div id="jsspeccy"></div>
    </div>

    <!-- Mando Táctil -->
    <div id="gamepad">
        <div class="d-pad">
            <div id="btn-up" class="btn" data-key="q">↑</div>
            <div id="btn-left" class="btn" data-key="o">←</div>
            <div id="btn-down" class="btn" data-key="a">↓</div>
            <div id="btn-right" class="btn" data-key="p">→</div>
        </div>
        <div class="action-buttons">
            <div id="btn-enter" class="btn btn-action" data-key="Enter">START</div>
            <div id="btn-jump" class="btn btn-action" data-key="Space">SALTAR</div>
        </div>
    </div>

    <!-- 1. LIBRERÍA DEL EMULADOR (Vital que no se borre) -->
    <script src="jsspeccy/jsspeccy.js"></script>

    <!-- 2. LÓGICA DEL JUEGO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');

            // Configuramos el emulador
            const speccy = JSSpeccy(document.getElementById('jsspeccy'), {
                autoStart: true,
                autoLoadTapes: true, // Esto obliga al emulador a escribir LOAD ""
                sandbox: false,
                machine: 48,
                zoom: 1
            });

            // Función para descargar e inyectar el casete
            function loadROM() {
                statusEl.textContent = 'Descargando casete virtual...';
                const absoluteURL = 'https://joseluis2525.github.io/panamajoe/panamajoe.tap';
                
                fetch(absoluteURL)
                    .then(response => {
                        if (!response.ok) throw new Error("Error de conexión");
                        return response.blob();
                    })
                    .then(blob => {
                        // Creamos el archivo para el emulador
                        const file = new File([blob], "panamajoe.tap");
                        
                        // Usamos la función exacta que tenías en tu código original
                        if (typeof speccy.openTAPFile === 'function') {
                            speccy.openTAPFile(file);
                        } else {
                            // Fallback de seguridad
                            const dt = new DataTransfer();
                            dt.items.add(file);
                            document.getElementById('jsspeccy').dispatchEvent(new DragEvent('drop', { bubbles: true, dataTransfer: dt }));
                        }
                        
                        statusEl.textContent = '¡Cinta reproduciendo! Verás los colores en breve...';
                    })
                    .catch(err => {
                        console.error(err);
                        statusEl.textContent = '❌ Error al cargar: ' + err.message;
                    });
            }

            // Damos 2 segundos para asegurar que JSSpeccy está 100% encendido antes de meter la cinta
            setTimeout(loadROM, 2000);

            // Sistema de controles táctiles
            const keyMap = { 'q':'q', 'a':'a', 'o':'o', 'p':'p', 'Space':' ', 'Enter':'Enter' };

            function sendKeyEvent(key, type) {
                const canvas = document.querySelector('#jsspeccy canvas');
                if (!canvas) return;
                const actualKey = keyMap[key] || key;
                const event = new KeyboardEvent(type, { key: actualKey, bubbles: true, cancelable: true });
                canvas.dispatchEvent(event);
            }

            document.querySelectorAll('.btn').forEach(btn => {
                const key = btn.getAttribute('data-key');
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    btn.classList.add('active');
                    sendKeyEvent(key, 'keydown');
                });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendKeyEvent(key, 'keyup');
                });
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendKeyEvent(key, 'keyup');
                });
            });

            // Evitar que la pantalla se seleccione al jugar rápido
            window.addEventListener('contextmenu', e => e.preventDefault());
        });
    </script>
</body>
</html>
