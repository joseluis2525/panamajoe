<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Panama Joe - Android Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif; background: #050505; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; overflow-x: hidden; touch-action: none;
        }
        
        #game-header { width: 100%; max-width: 600px; text-align: center; padding: 5px; background: #111; border-bottom: 2px solid #f0c040; }
        #game-header h1 { font-size: 1.1em; color: #f0c040; margin: 0; }
        #status { font-size: 0.8em; color: #aaa; margin: 5px 0; }

        /* Botón de carga manual integrado elegante */
        .upload-btn {
            display: inline-block; background: #333; border: 1px solid #f0c040;
            padding: 5px 15px; border-radius: 5px; font-size: 0.8em; color: #f0c040; margin-bottom: 5px;
        }
        .upload-btn:active { background: #f0c040; color: #000; }
        #manual-load { display: none; }

        #emulator-container {
            width: 100%; max-width: 600px; background: #000; padding: 2px;
            margin-bottom: 5px; /* Esto pega los controles al visor */
        }
        
        #jsspeccy { width: 100%; aspect-ratio: 4/3; border: 2px solid #333; }
        #jsspeccy canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; outline: none; }

        /* ZONA DE CONTROLES PEgada al visor */
        #gamepad-area {
            width: 100%; max-width: 600px; background: #1a1a2e;
            border-radius: 8px; padding: 10px; border: 1px solid #333;
        }

        /* Botones de menú ahora del 1 al 5 y Enter */
        .menu-keys { 
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; 
            margin-bottom: 15px; 
        }
        .menu-keys .btn { height: 40px; font-size: 1em; background: #2a2a3e; border: 1px solid #555; }

        .game-controls { display: flex; justify-content: space-around; align-items: center; }

        .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 5px; }
        
        .btn {
            background: #333; border: 2px solid #555; border-radius: 8px; color: #fff;
            display: flex; justify-content: center; align-items: center; font-size: 1.2em;
            user-select: none; -webkit-user-select: none; font-weight: bold;
        }
        .btn:active, .btn.active { background: #f0c040; color: #000; }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .btn-action { width: 80px; height: 80px; border-radius: 50%; background: #a93226; border: 3px solid #e6b0aa; }
        .btn-action:active, .btn-action.active { background: #f0c040; }
    </style>
</head>
<body>

    <div id="game-header">
        <h1>Panama Joe</h1>
        <div id="status">Iniciando emulador...</div>
        
        <!-- EL BOTÓN MANUAL QUE PEDISTE -->
        <label for="manual-load" class="upload-btn">📂 Cargar ROM manual (.tap)</label>
        <input type="file" id="manual-load" accept=".tap">
    </div>

    <div id="emulator-container">
        <div id="jsspeccy"></div>
    </div>

    <div id="gamepad-area">
        <!-- BOTONES DE MENÚ PARA SELECCIONAR TECLADO O DEFINIR TECLAS -->
        <div class="menu-keys">
            <div class="btn" data-key="1">1</div>
            <div class="btn" data-key="2">2</div>
            <div class="btn" data-key="3">3</div>
            <div class="btn" data-key="4">4</div>
            <div class="btn" data-key="5">5</div>
            <div class="btn" data-key="Enter">ENT</div>
        </div>

        <!-- CONTROLES DE JUEGO (D-PAD) -->
        <div class="game-controls">
            <div class="d-pad">
                <div id="btn-up" class="btn" data-key="q">↑</div>
                <div id="btn-left" class="btn" data-key="o">←</div>
                <div id="btn-down" class="btn" data-key="a">↓</div>
                <div id="btn-right" class="btn" data-key="p">→</div>
            </div>
            <div id="btn-jump" class="btn btn-action" data-key="Space">SALTO</div>
        </div>
    </div>

    <!-- LIBRERÍA ORIGINAL DEL EMULADOR -->
    <script src="jsspeccy/jsspeccy.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');
