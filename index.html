<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Panama Joe - Android Final</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif; background: #000; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; touch-action: none;
        }
        
        #game-header { width: 100%; text-align: center; padding: 5px; background: #111; z-index: 10; }
        #game-header h1 { font-size: 1em; color: #f0c040; margin: 0; }
        #status { font-size: 0.7em; color: #aaa; }

        #emulator-container {
            width: 100%; max-width: 600px; flex-grow: 1;
            display: flex; align-items: center; justify-content: center;
            background: #000; padding: 5px;
        }
        
        #jsspeccy { width: 100%; aspect-ratio: 4/3; border: 1px solid #333; }
        #jsspeccy canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; outline: none; }

        /* ZONA DE CONTROLES MEJORADA */
        #gamepad-area {
            width: 100%; max-width: 600px; background: #1a1a2e;
            border-top: 2px solid #444; padding: 10px; z-index: 10;
        }

        /* Botones de menú (1, 2, 3, Enter) necesarios para Panama Joe */
        .menu-keys { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .menu-keys .btn { height: 40px; flex: 1; margin: 0 5px; font-size: 1em; background: #222; }

        .game-controls { display: flex; justify-content: space-between; align-items: center; }

        .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 5px; }
        
        .btn {
            background: #333; border: 2px solid #555; border-radius: 8px; color: #fff;
            display: flex; justify-content: center; align-items: center; font-size: 1.2em;
            user-select: none; -webkit-user-select: none; font-weight: bold;
        }
        .btn:active, .btn.active { background: #f0c040; color: #000; }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .btn-action { width: 75px; height: 75px; border-radius: 50%; background: #a93226; border: 3px solid #e6b0aa; }
        .btn-action:active, .btn-action.active { background: #f0c040; }
    </style>
</head>
<body>

    <div id="game-header">
        <h1>Panama Joe (Espera a que cargue la cinta)</h1>
        <div id="status">Iniciando...</div>
    </div>

    <div id="emulator-container">
        <div id="jsspeccy"></div>
    </div>

    <div id="gamepad-area">
        <!-- BOTONES DE MENÚ PARA SELECCIONAR TECLADO -->
        <div class="menu-keys">
            <div class="btn" data-key="1">1</div>
            <div class="btn" data-key="2">2</div>
            <div class="btn" data-key="3">3</div>
            <div class="btn" data-key="Enter">ENT</div>
        </div>

        <!-- CONTROLES DE JUEGO -->
        <div class="game-controls">
            <div class="d-pad">
                <div id="btn-up" class="btn" data-key="q">↑</div>
                <div id="btn-left" class="btn" data-key="o">←</div>
                <div id="btn-down" class="btn" data-key="a">↓</div>
                <div id="btn-right" class="btn" data-key="p">→</div>
            </div>
            <div id="btn-jump" class="btn btn-action" data-key="Space">SALTO</div>
        </div>
    </div>

    <script src="jsspeccy/jsspeccy.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');

            const speccy = JSSpeccy(document.getElementById('jsspeccy'), {
                autoStart: true,
                autoLoadTapes: true,
                sandbox: false,
                machine: 48,
                zoom: 1
            });

            function loadROM() {
                statusEl.textContent = 'Descargando y conectando casete...';
                fetch('https://joseluis2525.github.io/panamajoe/panamajoe.tap')
                    .then(r => r.blob())
                    .then(blob => {
                        const file = new File([blob], "panamajoe.tap");
                        
                        if (typeof speccy.openTAPFile === 'function') speccy.openTAPFile(file);
                        else {
                            const dt = new DataTransfer(); dt.items.add(file);
                            document.getElementById('jsspeccy').dispatchEvent(new DragEvent('drop', { bubbles: true, dataTransfer: dt }));
                        }
                        
                        statusEl.textContent = '¡Cargando! SI VES RAYAS DE COLORES, ESPERA 2 MINUTOS.';
                    })
                    .catch(err => {
                        statusEl.textContent = '❌ Usa el archivo local si esto falla.';
                    });
            }

            setTimeout(loadROM, 1500);

            // SISTEMA DE INYECCIÓN DE TECLAS (Especial Android)
            const keyMap = { '1':'1', '2':'2', '3':'3', 'q':'q', 'a':'a', 'o':'o', 'p':'p', 'Space':' ', 'Enter':'Enter' };

            function sendKey(key, isDown) {
                const canvas = document.querySelector('#jsspeccy canvas');
                if (!canvas) return;
                
                // Forzamos el foco en el juego para que Android no lo ignore
                canvas.focus();
                
                const actualKey = keyMap[key] || key;
                let keyCode = actualKey.charCodeAt(0);
                if (key === 'Enter') keyCode = 13;
                if (key === 'Space') keyCode = 32;

                const eventType = isDown ? 'keydown' : 'keyup';
                
                // Creamos un evento "fuerte" compatible con emuladores antiguos
                const event = new KeyboardEvent(eventType, {
                    key: actualKey,
                    code: 'Key' + actualKey.toUpperCase(),
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true, 
                    cancelable: true 
                });
                
                // Engañamos al navegador para que respete el keyCode
                Object.defineProperty(event, 'keyCode', {get: () => keyCode});
                Object.defineProperty(event, 'which', {get: () => keyCode});
                
                canvas.dispatchEvent(event);
            }

            // Asignación táctil a los botones
            document.querySelectorAll('.btn').forEach(btn => {
                const key = btn.getAttribute('data-key');
                
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Evita scroll de pantalla
                    btn.classList.add('active');
                    sendKey(key, true);
                });
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendKey(key, false);
                });
                
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendKey(key, false);
                });
            });

            window.addEventListener('contextmenu', e => e.preventDefault());
        });
    </script>
</body>
</html>
