<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Panama Joe - Android Ultimate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif; background: #000; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100vh; width: 100vw; overflow: hidden; touch-action: none;
        }
        
        #game-header { width: 100%; text-align: center; padding: 5px; background: #111; z-index: 20; border-bottom: 2px solid #f0c040;}
        #game-header h1 { font-size: 1.1em; color: #f0c040; margin: 0; }
        #status { font-size: 0.8em; color: #aaa; margin: 2px 0; }

        .upload-btn {
            display: inline-block; background: #333; border: 1px solid #f0c040;
            padding: 3px 10px; border-radius: 5px; font-size: 0.8em; color: #f0c040;
        }
        .upload-btn:active { background: #f0c040; color: #000; }
        #manual-load { display: none; }

        #emulator-container {
            width: 100%; max-width: 600px; display: flex; justify-content: center;
        }
        
        /* Ocultar barra blanca del emulador */
        [class*="menu"], [class*="toolbar"], [class*="statusbar"] { display: none !important; }
        
        #jsspeccy { width: 100%; aspect-ratio: 4/3; border: 1px solid #333; overflow: hidden; background: #000;}
        #jsspeccy canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; outline: none; object-fit: contain; }

        #gamepad-area {
            width: 100%; max-width: 600px; background: #1a1a2e;
            padding: 10px; z-index: 10; flex-grow: 1; display: flex; flex-direction: column;
        }

        /* --- LOS NUEVOS BOTONES AZUL Y VERDE --- */
        .top-menu { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; width: 100%; }
        .top-menu .btn { padding: 0 15px; height: 45px; font-size: 0.9em; border-radius: 25px; border-width: 2px; }
        
        .btn-blue { background: #1b4f72 !important; border-color: #3498db !important; }
        .btn-blue:active, .btn-blue.active { background: #3498db !important; }
        
        .btn-green { background: #145a32 !important; border-color: #2ecc71 !important; }
        .btn-green:active, .btn-green.active { background: #2ecc71 !important; }

        /* Controles de juego */
        .game-controls { display: flex; justify-content: space-around; align-items: center; width: 100%; margin-top: auto; margin-bottom: auto;}
        .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 5px; }
        
        .btn {
            background: #333; border: 2px solid #555; border-radius: 8px; color: #fff;
            display: flex; justify-content: center; align-items: center; font-size: 1.2em;
            user-select: none; -webkit-user-select: none; font-weight: bold; cursor: pointer;
        }
        .btn:active, .btn.active { background: #f0c040; color: #000; }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .btn-action { width: 85px; height: 85px; border-radius: 50%; background: #a93226; border: 3px solid #e6b0aa; }
        .btn-action:active, .btn-action.active { background: #f0c040; }

        /* =========================================
           MODO HORIZONTAL (GAMEPAD FLOTANTE)
           ========================================= */
        @media (orientation: landscape) {
            #game-header { display: none; } 
            
            #emulator-container { 
                width: 100vw; height: 100vh; max-width: none;
                position: fixed; top: 0; left: 0; z-index: 1;
            }
            #jsspeccy { height: 100vh; width: 100vw; border: none; }

            #gamepad-area {
                position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                background: transparent; border: none; padding: 0;
                pointer-events: none; 
                z-index: 9999; display: block;
            }

            .btn { pointer-events: auto; opacity: 0.6; } 
            .btn:active, .btn.active { opacity: 0.9; }

            /* Botones de menú anclados arriba al centro */
            .top-menu { 
                position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
                width: max-content; gap: 20px;
            }

            /* Desarmar la caja flex para usar posiciones absolutas en la cruceta */
            .game-controls { position: static; display: block; }
            
            /* Cruceta en la esquina inferior izquierda */
            .d-pad { 
                position: absolute; bottom: 20px; left: 30px; 
                transform: scale(1.1); transform-origin: bottom left; 
            }
            .d-pad .btn { border-radius: 50%; } 

            /* Salto en la esquina inferior derecha */
            #btn-jump { 
                position: absolute; bottom: 30px; right: 40px; 
                width: 90px; height: 90px; 
            }
        }
    </style>
</head>
<body>

    <div id="game-header">
        <h1>Panama Joe</h1>
        <div id="status">Iniciando emulador...</div>
        <label for="manual-load" class="upload-btn">📂 Cargar manual</label>
        <input type="file" id="manual-load" accept=".tap">
    </div>

    <div id="emulator-container">
        <div id="jsspeccy"></div>
    </div>

    <div id="gamepad-area">
        
        <!-- LOS NUEVOS BOTONES EVIDENTES Y CLAROS -->
        <div class="top-menu">
            <div class="btn btn-blue" data-key="4">⚙️ CONFIG (4)</div>
            <div class="btn btn-green" data-key="5">▶ JUGAR (5)</div>
        </div>

        <div class="game-controls">
            <!-- D-PAD (Mapeado internamente a Q, A, O, P) -->
            <div class="d-pad">
                <div id="btn-up" class="btn" data-key="q">↑</div>
                <div id="btn-left" class="btn" data-key="o">←</div>
                <div id="btn-down" class="btn" data-key="a">↓</div>
                <div id="btn-right" class="btn" data-key="p">→</div>
            </div>
            <div id="btn-jump" class="btn btn-action" data-key="Space">SALTO</div>
        </div>
    </div>

    <script src="jsspeccy/jsspeccy.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');
            const manualLoadInput = document.getElementById('manual-load');

            const speccy = JSSpeccy(document.getElementById('jsspeccy'), {
                autoStart: true, autoLoadTapes: true, sandbox: false, machine: 48,
                uiEnabled: false, zoom: 1
            });

            function forceLoadFile(file) {
                if (typeof speccy.openTAPFile === 'function') {
                    try { speccy.openTAPFile(file); return; } catch(e){}
                }
                const dt = new DataTransfer(); dt.items.add(file);
                const dropEvent = new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt });
                document.getElementById('jsspeccy').dispatchEvent(dropEvent);
                const canvas = document.querySelector('#jsspeccy canvas');
                if(canvas) canvas.dispatchEvent(dropEvent);
            }

            function autoLoadROM() {
                statusEl.textContent = 'Auto-cargando juego desde GitHub...';
                fetch('panamajoe.tap')
                    .then(response => {
                        if (!response.ok) throw new Error("No encontrado");
                        return response.blob();
                    })
                    .then(blob => {
                        const file = new File([blob], "panamajoe.tap");
                        forceLoadFile(file);
                        statusEl.textContent = '¡Cargando! SI VES RAYAS, ESPERA 2 MINUTOS.';
                    })
                    .catch(err => {
                        statusEl.textContent = 'Error. Usa "Cargar manual".';
                    });
            }

            manualLoadInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;
                statusEl.textContent = 'Cargando... ESPERA LAS RAYAS.';
                forceLoadFile(file);
            });

            setTimeout(autoLoadROM, 1500);

            // MAPA DE TECLAS CLÁSICAS
            const keyMap = { 
                '4':'4', '5':'5', 
                'q':'Q', 'a':'A', 'o':'O', 'p':'P', 
                'Space':' '
            };

            function sendKey(key, isDown) {
                const canvas = document.querySelector('#jsspeccy canvas');
                if (!canvas) return;
                canvas.focus();
                
                const actualKey = keyMap[key] || key;
                let keyCode;
                if (key === 'Space') keyCode = 32;
                else keyCode = actualKey.toUpperCase().charCodeAt(0);

                const eventType = isDown ? 'keydown' : 'keyup';
                const event = new KeyboardEvent(eventType, {
                    key: actualKey, code: 'Key' + actualKey.toUpperCase(),
                    keyCode: keyCode, which: keyCode, bubbles: true, cancelable: true 
                });
                
                Object.defineProperty(event, 'keyCode', {get: () => keyCode});
                Object.defineProperty(event, 'which', {get: () => keyCode});
                
                canvas.dispatchEvent(event);
            }

            document.querySelectorAll('.btn').forEach(btn => {
                const key = btn.getAttribute('data-key');
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault(); btn.classList.add('active'); sendKey(key, true);
                });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault(); btn.classList.remove('active'); sendKey(key, false);
                });
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault(); btn.classList.remove('active'); sendKey(key, false);
                });
            });

            window.addEventListener('contextmenu', e => e.preventDefault());
        });
    </script>
</body>
</html>
